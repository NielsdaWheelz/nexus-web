name: nexus

x-logging: &default-logging
  driver: journald
  options:
    tag: "{{.Name}}"

# The Codex host's only network peer. Its /etc/hosts pins exactly these names to
# the proxy (extra_hosts on nexus-codex-agent-host; keep the two lists equal). A
# TLS stream is forwarded, still encrypted, only when its SNI is listed; any
# other is sent to a closed port and dropped. Upstream names resolve through
# Docker's DNS on codex_proxy_egress; the host itself resolves nothing else.
x-codex-egress-conf: &codex-egress-conf |
  pid /tmp/nginx.pid;
  events {}
  stream {
      resolver 127.0.0.11 ipv6=off valid=30s;
      map $$ssl_preread_server_name $$upstream {
          chatgpt.com     chatgpt.com:443;
          auth.openai.com auth.openai.com:443;
          default         127.0.0.1:1;
      }
      server {
          listen 443;
          ssl_preread on;
          proxy_pass $$upstream;
          proxy_connect_timeout 10s;
          proxy_timeout 20m;
      }
  }

services:
  postgres:
    image: ${POSTGRES_IMAGE:?set an immutable production digest}
    restart: unless-stopped
    mem_reservation: 256m
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 256
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set}
      POSTGRES_DB: ${POSTGRES_DB:?set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging

  caddy:
    image: ${CADDY_IMAGE:?set an immutable production digest}
    restart: unless-stopped
    mem_reservation: 32m
    mem_limit: 48m
    memswap_limit: 48m
    pids_limit: 128
    environment:
      CADDY_SITE: ${CADDY_SITE:?set}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:?set}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - /etc/nexus/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    logging: *default-logging

  api:
    image: ${API_IMAGE:?set an immutable candidate digest}
    restart: unless-stopped
    mem_reservation: 192m
    mem_limit: 320m
    memswap_limit: 320m
    pids_limit: 256
    env_file:
      - ${NEXUS_CONFIG_FILE:?set a captured content-addressed config}
    environment:
      NEXUS_CODEX_NATIVE_SOCKET: /tmp/codex-daemon-10001/app-server.sock
      MEMORY_CLIENT_CONFIG_PATH: /run/secrets/nexus-memory-client.json
    depends_on:
      postgres:
        condition: service_healthy
      # Readonly model catalog access uses the same private native socket.
      # Start ordering is sufficient; host unavailability remains a typed route
      # outcome and must not block unrelated API readiness.
      nexus-codex-agent-host:
        condition: service_started
    expose:
      - "8000"
    networks:
      default: {}
    volumes:
      - nexus_codex_run:/tmp/codex-daemon-10001:ro
      - type: bind
        source: ${NEXUS_MEMORY_CLIENT_CONFIG_FILE:?publish the private memory declaration}
        target: /run/secrets/nexus-memory-client.json
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--show-error",
          "--location",
          "--max-redirs",
          "10",
          "--max-time",
          "5",
          "--output",
          "/dev/null",
          "http://127.0.0.1:8000/readyz",
        ]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s
    logging: *default-logging

  worker-interactive:
    image: ${WORKER_IMAGE:?set an immutable candidate digest}
    restart: unless-stopped
    mem_reservation: 128m
    mem_limit: 320m
    memswap_limit: 320m
    pids_limit: 256
    env_file:
      - ${NEXUS_CONFIG_FILE:?set a captured content-addressed config}
    environment:
      WORKER_LANE: interactive
      DATABASE_STATEMENT_TIMEOUT_MS: "300000"
      DATABASE_IDLE_IN_TX_TIMEOUT_MS: "0"
      NEXUS_CODEX_NATIVE_SOCKET: /tmp/codex-daemon-10001/app-server.sock
      MEMORY_CLIENT_CONFIG_PATH: /run/secrets/nexus-memory-client.json
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
      # Start ordering only: an unavailable host soft-fails generation work and
      # must not prevent the interactive lane from serving unrelated jobs.
      nexus-codex-agent-host:
        condition: service_started
    volumes:
      - nexus_codex_run:/tmp/codex-daemon-10001
      - type: bind
        source: ${NEXUS_MEMORY_CLIENT_CONFIG_FILE:?publish the private memory declaration}
        target: /run/secrets/nexus-memory-client.json
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python", "-S", "-m", "apps.worker.health", "--lane", "interactive"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s
    logging: *default-logging

  worker-background:
    image: ${WORKER_IMAGE:?set an immutable candidate digest}
    init: true
    restart: unless-stopped
    mem_reservation: 128m
    mem_limit: 448m
    memswap_limit: 448m
    pids_limit: 256
    # SIGTERM reaches the supervisor through docker-init; it terminates the running
    # child (TERM grace then KILL), releases the claim and Heavy capacity, then exits.
    # Covers BACKGROUND_PROCESS_TERM_GRACE_SECONDS plus one settlement, matches the
    # `docker compose stop --timeout 30` the release flow already passes, and also
    # protects an ad-hoc `docker compose restart`/`down`.
    stop_grace_period: 30s
    env_file:
      - ${NEXUS_CONFIG_FILE:?set a captured content-addressed config}
    environment:
      WORKER_LANE: background
      DATABASE_STATEMENT_TIMEOUT_MS: "300000"
      DATABASE_IDLE_IN_TX_TIMEOUT_MS: "0"
      BACKGROUND_PROCESS_CGROUP_ROOT: /sys/fs/cgroup
      BACKGROUND_PROCESS_WALL_TIMEOUT_SECONDS: "900"
      BACKGROUND_PROCESS_TERM_GRACE_SECONDS: "5"
      BACKGROUND_PROCESS_RESULT_MAX_BYTES: "1048576"
      BACKGROUND_PROCESS_OOM_SCORE_ADJ: "750"
      NEXUS_CODEX_NATIVE_SOCKET: /tmp/codex-daemon-10001/app-server.sock
    depends_on:
      postgres:
        condition: service_healthy
      # Start ordering only, so a generation job is not claimed before the Codex
      # host container and its socket volume exist. Readiness is deliberately
      # NOT a dependency: `service_healthy` would couple the entire background
      # lane — ingest, podcasts, reindex, teardown — to the Codex host, so one
      # expired ChatGPT credential would stop all background work. A host that
      # starts but never becomes ready instead affects only generation jobs,
      # through their normalized generation-failure contracts.
      nexus-codex-agent-host:
        condition: service_started
    volumes:
      - /var/lib/nexus/parser-tmp:/var/lib/nexus/parser-tmp
      - nexus_codex_run:/tmp/codex-daemon-10001
    healthcheck:
      test: ["CMD", "python", "-S", "-m", "apps.worker.health", "--lane", "background"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s
    logging: *default-logging

  codex-egress-policy:
    # Stock image pinned by digest: the allowlist is reviewed policy, so its
    # bytes are pinned where its configuration is.
    image: nginx:1.30.5-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    restart: unless-stopped
    mem_reservation: 16m
    mem_limit: 64m
    memswap_limit: 64m
    pids_limit: 32
    user: "101:101"
    environment:
      NGINX_CONF: *codex-egress-conf
    # Skips the image's entrypoint scripts; the configuration is this file's,
    # written to tmpfs (compose refuses inline configs for a read-only service).
    entrypoint:
      - sh
      - -c
      - printf '%s' "$$NGINX_CONF" > /tmp/nginx.conf && exec nginx -e stderr -c /tmp/nginx.conf -g 'daemon off;'
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m
    networks:
      codex_private:
        ipv4_address: 172.30.0.2
      codex_proxy_egress: {}
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "443"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
    logging: *default-logging

  nexus-codex-agent-host:
    image: ${WORKER_IMAGE:?set an immutable candidate digest}
    # Docker cannot create this container while the LUKS state is locked: the
    # bind source does not exist on the guarded underlay (create_host_path:
    # false). A crashed app-server restarts; a clean stop or a manual kill stays
    # down. Workers never receive the account mount; they share only the socket.
    restart: on-failure:3
    mem_reservation: 256m
    mem_limit: 448m
    memswap_limit: 448m
    pids_limit: 64
    cpus: 1.0
    command: ["python", "-m", "apps.codex_agent.main"]
    user: "10001:10001"
    environment:
      NEXUS_CODEX_CREDENTIAL_FILE: /var/lib/nexus-codex/codex/codex-personal/auth.json
      NEXUS_CODEX_NATIVE_SOCKET: /tmp/codex-daemon-10001/app-server.sock
    depends_on:
      codex-egress-policy:
        condition: service_healthy
    working_dir: /tmp
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # The egress allowlist's names (keep equal to x-codex-egress-conf). Nothing
    # else resolves: an internal network gets no external DNS.
    extra_hosts:
      - "chatgpt.com:172.30.0.2"
      - "auth.openai.com:172.30.0.2"
    networks:
      codex_private:
        ipv4_address: 172.30.0.3
    init: true
    stop_grace_period: 45s
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    ulimits:
      core: 0
      # codex 0.160.0 holds ~65 descriptors idle and up to 89 with four turns at once.
      nofile: 1024
    volumes:
      - type: bind
        source: /srv/nexus/codex-state/codex/codex-personal
        target: /var/lib/nexus-codex/codex/codex-personal
        read_only: false
        bind:
          create_host_path: false
          propagation: rprivate
      - nexus_codex_run:/tmp/codex-daemon-10001
    healthcheck:
      test: ["CMD", "python", "-m", "apps.codex_agent.health"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 15s
    logging: *default-logging

  backup:
    profiles: ["backup"]
    image: ${API_IMAGE:?set an immutable candidate digest}
    restart: "no"
    init: true
    user: "10001:10001"
    mem_reservation: 128m
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    env_file:
      - ${NEXUS_BACKUP_CONFIG_FILE:-/dev/null}
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:?set}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set}
      PGDATABASE: ${POSTGRES_DB:?set}
    command: ["python", "-m", "nexus.release_backup", "check"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    volumes:
      - ${NEXUS_BACKUP_STATE_DIRECTORY:-/var/backups/nexus/r2}:/backup-state
    logging: *default-logging

  migration:
    profiles: ["release"]
    image: ${API_IMAGE:?set an immutable candidate digest}
    mem_reservation: 256m
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 256
    env_file:
      - ${NEXUS_CONFIG_FILE:?set a captured content-addressed config}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "cd /app/migrations && /app/.venv/bin/alembic upgrade head"]
    logging: *default-logging

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  nexus_codex_run:

networks:
  codex_private:
    driver: bridge
    internal: true
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    ipam:
      config:
        - subnet: 172.30.0.0/24
  codex_proxy_egress:
    driver: bridge
