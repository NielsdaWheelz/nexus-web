name: nexus

x-logging: &default-logging
  driver: journald
  options:
    tag: "{{.Name}}"

services:
  postgres:
    image: ${POSTGRES_IMAGE:?set an immutable production digest}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set}
      POSTGRES_DB: ${POSTGRES_DB:?set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging

  caddy:
    image: ${CADDY_IMAGE:?set an immutable production digest}
    restart: unless-stopped
    environment:
      CADDY_SITE: ${CADDY_SITE:?set}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:?set}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - /etc/nexus/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *default-logging

  api:
    image: ${API_IMAGE:?set an immutable candidate digest}
    restart: unless-stopped
    env_file:
      - ${NEXUS_CONFIG_FILE:?set a captured content-addressed config}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=5).read()\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s
    logging: *default-logging

  worker-interactive:
    image: ${WORKER_IMAGE:?set an immutable candidate digest}
    restart: unless-stopped
    env_file:
      - ${NEXUS_CONFIG_FILE:?set a captured content-addressed config}
    environment:
      WORKER_LANE: interactive
      DATABASE_STATEMENT_TIMEOUT_MS: "300000"
      DATABASE_IDLE_IN_TX_TIMEOUT_MS: "0"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "apps.worker.health", "--lane", "interactive"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s
    logging: *default-logging

  worker-background:
    image: ${WORKER_IMAGE:?set an immutable candidate digest}
    restart: unless-stopped
    env_file:
      - ${NEXUS_CONFIG_FILE:?set a captured content-addressed config}
    environment:
      WORKER_LANE: background
      DATABASE_STATEMENT_TIMEOUT_MS: "300000"
      DATABASE_IDLE_IN_TX_TIMEOUT_MS: "0"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "apps.worker.health", "--lane", "background"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s
    logging: *default-logging

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
