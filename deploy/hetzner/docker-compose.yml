name: nexus

x-logging: &default-logging
  driver: journald
  options:
    tag: "{{.Name}}"

services:
  postgres:
    image: ${POSTGRES_IMAGE:?set an immutable production digest}
    restart: unless-stopped
    mem_reservation: 256m
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 256
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set}
      POSTGRES_DB: ${POSTGRES_DB:?set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging

  caddy:
    image: ${CADDY_IMAGE:?set an immutable production digest}
    restart: unless-stopped
    mem_reservation: 32m
    mem_limit: 48m
    memswap_limit: 48m
    pids_limit: 128
    environment:
      CADDY_SITE: ${CADDY_SITE:?set}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:?set}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - /etc/nexus/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    logging: *default-logging

  api:
    image: ${API_IMAGE:?set an immutable candidate digest}
    restart: unless-stopped
    mem_reservation: 192m
    mem_limit: 320m
    memswap_limit: 320m
    pids_limit: 256
    env_file:
      - ${NEXUS_CONFIG_FILE:?set a captured content-addressed config}
    environment:
      NEXUS_CODEX_AGENT_SOCKET: /run/nexus-codex/agent.sock
    depends_on:
      postgres:
        condition: service_healthy
      # Request-scoped dossier resolution uses the same private generation UDS.
      # Start ordering is sufficient; host unavailability remains a typed route
      # outcome and must not block unrelated API readiness.
      nexus-codex-agent-host:
        condition: service_started
    expose:
      - "8000"
    volumes:
      - nexus_codex_run:/run/nexus-codex:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=5).read()\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s
    logging: *default-logging

  worker-interactive:
    image: ${WORKER_IMAGE:?set an immutable candidate digest}
    restart: unless-stopped
    mem_reservation: 128m
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 256
    env_file:
      - ${NEXUS_CONFIG_FILE:?set a captured content-addressed config}
    environment:
      WORKER_LANE: interactive
      DATABASE_STATEMENT_TIMEOUT_MS: "300000"
      DATABASE_IDLE_IN_TX_TIMEOUT_MS: "0"
      NEXUS_CODEX_AGENT_SOCKET: /run/nexus-codex/agent.sock
      NEXUS_AGENT_TOOLS_MCP_LISTEN: 0.0.0.0:8001
      NEXUS_AGENT_TOOLS_MCP_ORIGIN: https://${CADDY_SITE:?set}/internal/agent-tools/mcp
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
      # Start ordering only: an unavailable host soft-fails generation work and
      # must not prevent the interactive lane from serving unrelated jobs.
      nexus-codex-agent-host:
        condition: service_started
    expose:
      - "8001"
    volumes:
      - nexus_codex_run:/run/nexus-codex:ro
    healthcheck:
      test: ["CMD", "python", "-S", "-m", "apps.worker.health", "--lane", "interactive"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s
    logging: *default-logging

  worker-background:
    image: ${WORKER_IMAGE:?set an immutable candidate digest}
    init: true
    restart: unless-stopped
    mem_reservation: 128m
    mem_limit: 448m
    memswap_limit: 448m
    pids_limit: 256
    # SIGTERM reaches the supervisor through docker-init; it terminates the running
    # child (TERM grace then KILL), releases the claim and Heavy capacity, then exits.
    # Covers BACKGROUND_PROCESS_TERM_GRACE_SECONDS plus one settlement, matches the
    # `docker compose stop --timeout 30` the release flow already passes, and also
    # protects an ad-hoc `docker compose restart`/`down`.
    stop_grace_period: 30s
    env_file:
      - ${NEXUS_CONFIG_FILE:?set a captured content-addressed config}
    environment:
      WORKER_LANE: background
      DATABASE_STATEMENT_TIMEOUT_MS: "300000"
      DATABASE_IDLE_IN_TX_TIMEOUT_MS: "0"
      BACKGROUND_PROCESS_CGROUP_ROOT: /sys/fs/cgroup
      BACKGROUND_PROCESS_WALL_TIMEOUT_SECONDS: "900"
      BACKGROUND_PROCESS_TERM_GRACE_SECONDS: "5"
      BACKGROUND_PROCESS_RESULT_MAX_BYTES: "1048576"
      BACKGROUND_PROCESS_OOM_SCORE_ADJ: "750"
      NEXUS_CODEX_AGENT_SOCKET: /run/nexus-codex/agent.sock
    depends_on:
      postgres:
        condition: service_healthy
      # Start ordering only, so a generation job is not claimed before the Codex
      # host container and its socket volume exist. Readiness is deliberately
      # NOT a dependency: `service_healthy` would couple the entire background
      # lane — ingest, podcasts, reindex, teardown — to the Codex host, so one
      # expired ChatGPT credential would stop all background work. A host that
      # starts but never becomes ready instead affects only generation jobs,
      # through their normalized generation-failure contracts.
      nexus-codex-agent-host:
        condition: service_started
    volumes:
      - /var/lib/nexus/parser-tmp:/var/lib/nexus/parser-tmp
      - nexus_codex_run:/run/nexus-codex:ro
    healthcheck:
      test: ["CMD", "python", "-S", "-m", "apps.worker.health", "--lane", "background"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s
    logging: *default-logging

  codex-egress-policy:
    image: ${WORKER_IMAGE:?set an immutable candidate digest}
    restart: unless-stopped
    init: true
    mem_reservation: 32m
    mem_limit: 64m
    memswap_limit: 64m
    pids_limit: 32
    command: ["python", "-m", "apps.codex_agent.egress_policy"]
    user: "10002:10002"
    environment:
      NEXUS_CODEX_EGRESS_PROXY_IP: 172.30.0.2
      NEXUS_CODEX_EGRESS_MCP_HOST: ${CADDY_SITE:?set}
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m
    networks:
      codex_private:
        ipv4_address: 172.30.0.2
      codex_proxy_egress: {}
    healthcheck:
      test: ["CMD", "python", "-m", "apps.codex_agent.egress_policy", "health"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
    logging: *default-logging

  nexus-codex-agent-host:
    image: ${WORKER_IMAGE:?set an immutable candidate digest}
    # The encrypted credential filesystem is unlocked manually after reboot.
    # Never let Docker restart this container against the protected underlay.
    # Pinned Codex 0.144.4 updates only this exact file with truncate/write;
    # every other Codex state and temporary path remains in one per-turn tree.
    restart: "no"
    mem_reservation: 128m
    mem_limit: 384m
    memswap_limit: 384m
    pids_limit: 64
    cpus: 1.0
    command: ["python", "-m", "apps.codex_agent.main"]
    user: "10001:10001"
    environment:
      NEXUS_CODEX_CREDENTIAL_FILE: /run/nexus-codex-credential/auth.json
      NEXUS_CODEX_WORKING_DIRECTORY_ROOT: /run/nexus-codex-turns
      NEXUS_CODEX_AGENT_SOCKET: /run/nexus-codex/agent.sock
      NEXUS_CODEX_MCP_ORIGIN: https://${CADDY_SITE:?set}/internal/agent-tools/mcp
      NEXUS_CODEX_MODEL_TOOL_NETWORK_ATTESTED: "true"
    depends_on:
      codex-egress-policy:
        condition: service_healthy
    working_dir: /tmp
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      # The trusted outer host must be able to construct Codex's stricter
      # bwrap+seccomp child sandbox. It remains non-root, capability-free,
      # read-only, and release-gated on the real inner sandbox probe.
      - seccomp=unconfined
      - apparmor=nexus-codex-agent-host
      - systempaths=unconfined
    dns:
      - 172.30.0.2
    networks:
      codex_private:
        ipv4_address: 172.30.0.3
    init: true
    # Host-owned shutdown budget: the request drain, the interrupted turn's runtime
    # close deadline, and an exit margin. See apps/codex_agent/host.py.
    stop_grace_period: 45s
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
      # provider-runtime publishes the private Codex SDK launcher beside its
      # profile state. Keep that executable write surface to this 0700 tmpfs;
      # general-purpose /tmp remains noexec.
      # 180 MiB is derived from two 74 MiB policy-bounded serialized-state
      # files plus 32 MiB launcher/cache/cleanup headroom.
      - /run/nexus-codex-turns:rw,exec,nosuid,nodev,size=180m,mode=0700,uid=10001,gid=10001
    ulimits:
      core: 0
      # generation_policy.CODEX_EPHEMERAL_FILE_LIMIT_BYTES
      fsize: 77594624
      nofile: 64
    volumes:
      - type: bind
        source: /srv/nexus/codex-state/codex/codex-personal/auth.json
        target: /run/nexus-codex-credential/auth.json
        read_only: false
        bind:
          create_host_path: false
          propagation: rprivate
      - nexus_codex_run:/run/nexus-codex
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -m apps.codex_agent.health",
        ]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 15s
    logging: *default-logging

  migration:
    profiles: ["release"]
    image: ${API_IMAGE:?set an immutable candidate digest}
    mem_reservation: 256m
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 256
    env_file:
      - ${NEXUS_CONFIG_FILE:?set a captured content-addressed config}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "cd /app/migrations && /app/.venv/bin/alembic upgrade head"]
    logging: *default-logging

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  nexus_codex_run:

networks:
  codex_private:
    driver: bridge
    internal: true
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    ipam:
      config:
        - subnet: 172.30.0.0/24
  codex_proxy_egress:
    driver: bridge
