name: nexus

x-logging: &default-logging
  driver: journald
  options:
    tag: "{{.Name}}"

services:
  postgres:
    image: ${POSTGRES_IMAGE:?set an immutable production digest}
    restart: unless-stopped
    mem_reservation: 256m
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 256
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set}
      POSTGRES_DB: ${POSTGRES_DB:?set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging

  caddy:
    image: ${CADDY_IMAGE:?set an immutable production digest}
    restart: unless-stopped
    mem_reservation: 32m
    mem_limit: 48m
    memswap_limit: 48m
    pids_limit: 128
    environment:
      CADDY_SITE: ${CADDY_SITE:?set}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:?set}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - /etc/nexus/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *default-logging

  api:
    image: ${API_IMAGE:?set an immutable candidate digest}
    restart: unless-stopped
    mem_reservation: 192m
    mem_limit: 320m
    memswap_limit: 320m
    pids_limit: 256
    env_file:
      - ${NEXUS_CONFIG_FILE:?set a captured content-addressed config}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=5).read()\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s
    logging: *default-logging

  worker-interactive:
    image: ${WORKER_IMAGE:?set an immutable candidate digest}
    restart: unless-stopped
    mem_reservation: 128m
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 256
    env_file:
      - ${NEXUS_CONFIG_FILE:?set a captured content-addressed config}
    environment:
      WORKER_LANE: interactive
      DATABASE_STATEMENT_TIMEOUT_MS: "300000"
      DATABASE_IDLE_IN_TX_TIMEOUT_MS: "0"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-S", "-m", "apps.worker.health", "--lane", "interactive"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s
    logging: *default-logging

  worker-background:
    image: ${WORKER_IMAGE:?set an immutable candidate digest}
    restart: unless-stopped
    mem_reservation: 128m
    mem_limit: 448m
    memswap_limit: 448m
    pids_limit: 256
    env_file:
      - ${NEXUS_CONFIG_FILE:?set a captured content-addressed config}
    environment:
      WORKER_LANE: background
      DATABASE_STATEMENT_TIMEOUT_MS: "300000"
      DATABASE_IDLE_IN_TX_TIMEOUT_MS: "0"
      NEXUS_CODEX_AGENT_SOCKET: /run/nexus-codex/agent.sock
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    volumes:
      - /var/lib/nexus/parser-tmp:/var/lib/nexus/parser-tmp
      - nexus_codex_run:/run/nexus-codex:ro
    healthcheck:
      test: ["CMD", "python", "-S", "-m", "apps.worker.health", "--lane", "background"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s
    logging: *default-logging

  nexus-codex-agent-host:
    image: ${WORKER_IMAGE:?set an immutable candidate digest}
    restart: unless-stopped
    mem_reservation: 128m
    mem_limit: 384m
    memswap_limit: 384m
    pids_limit: 64
    cpus: 1.0
    command: ["python", "-m", "apps.codex_agent.main"]
    user: "10001:10001"
    environment:
      NEXUS_CODEX_STATE_ROOT_BASE: /var/lib/nexus-codex
      NEXUS_CODEX_WORKING_DIRECTORY: /var/empty/nexus-codex
      NEXUS_CODEX_AGENT_SOCKET: /run/nexus-codex/agent.sock
    working_dir: /var/empty/nexus-codex
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      # The trusted outer host must be able to construct Codex's stricter
      # bwrap+seccomp child sandbox. It remains non-root, capability-free,
      # read-only, and release-gated on the real inner sandbox probe.
      - seccomp=unconfined
      - apparmor=nexus-codex-agent-host
      - systempaths=unconfined
    networks:
      - codex_egress
    init: true
    stop_grace_period: 15s
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    ulimits:
      core: 0
      fsize: 1048576
      nofile: 64
    volumes:
      - nexus_codex_state:/var/lib/nexus-codex
      - nexus_codex_run:/run/nexus-codex
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -m apps.codex_agent.health",
        ]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 15s
    logging: *default-logging

  migration:
    profiles: ["release"]
    image: ${API_IMAGE:?set an immutable candidate digest}
    mem_reservation: 256m
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 256
    env_file:
      - ${NEXUS_CONFIG_FILE:?set a captured content-addressed config}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "cd /app/migrations && /app/.venv/bin/alembic upgrade head"]
    logging: *default-logging

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  nexus_codex_state:
  nexus_codex_run:

networks:
  codex_egress:
    driver: bridge
