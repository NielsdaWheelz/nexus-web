#cloud-config
package_update: true
package_upgrade: true

packages:
  - apparmor
  - ca-certificates
  - curl
  - cryptsetup
  - fail2ban
  - gnupg
  - lsb-release
  - ufw

write_files:
  - path: /root/.nexus-tailscale-auth-key
    owner: root:root
    permissions: "0600"
    content: "__NEXUS_TAILSCALE_AUTH_KEY__"
  # Keep Ubuntu's AppArmor user-namespace hardening persistent. Native callbacks
  # require no host exception or nested execution namespace.
  - path: /etc/sysctl.d/60-nexus-codex-userns.conf
    owner: root:root
    permissions: "0644"
    content: |
      kernel.apparmor_restrict_unprivileged_userns=1
  - path: /etc/ssh/sshd_config.d/99-nexus-hardening.conf
    owner: root:root
    permissions: "0644"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
      PermitRootLogin no
      X11Forwarding no
      GatewayPorts no
      AllowUsers nexus
  # Container logs use the journald driver, so the host journal must persist
  # across reboots and stay bounded.
  - path: /etc/systemd/journald.conf.d/10-nexus.conf
    owner: root:root
    permissions: "0644"
    content: |
      [Journal]
      Storage=persistent
      SystemMaxUse=256M

users:
  - default
  - name: nexus
    gecos: Nexus deploy user
    groups: sudo
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    ssh_authorized_keys:
      - __NEXUS_SSH_PUBLIC_KEY__

runcmd:
  - sysctl --system
  - test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - sh -c '. /etc/os-release && echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu ${VERSION_CODENAME} stable" > /etc/apt/sources.list.d/docker.list'
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - usermod -aG docker nexus
  - install -d -o root -g root -m 0750 /etc/nexus /etc/nexus/config
  - install -d -o root -g root -m 0750 /var/lib/nexus/releases
  - install -d -o 10001 -g 10001 -m 0700 /var/lib/nexus/parser-tmp
  - install -d -o root -g root -m 0750 /var/backups/nexus
  # The release controller installs the immutable boot guard before the Codex
  # host can start. Until the operator unlocks and mounts its LUKS2 container,
  # this underlay is inaccessible to the non-root host uid.
  - install -d -o root -g root -m 000 /srv/nexus/codex-state
  - |
    if [ ! -e /swapfile ]; then
      # mkswap reserves the first page for its header, so a file sized at exactly
      # 1 GiB reports SwapTotal one page short of the release gate. Provision
      # above the gate so `SwapTotal >= 1 GiB` genuinely holds.
      fallocate --length 1025M /swapfile
      chmod 0600 /swapfile
      mkswap /swapfile
    fi
    swapon --show=NAME --noheadings | grep -qx /swapfile || swapon /swapfile
    grep -qxF '/swapfile none swap sw 0 0' /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab
  - curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg -o /usr/share/keyrings/tailscale-archive-keyring.gpg
  - curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.tailscale-keyring.list -o /etc/apt/sources.list.d/tailscale.list
  - apt-get update
  - apt-get install -y tailscale
  - systemctl enable --now tailscaled
  - |
    set -eu
    trap 'rm -f /root/.nexus-tailscale-auth-key' EXIT
    tailscale up --auth-key=file:/root/.nexus-tailscale-auth-key \
      --hostname=nexus-prod --advertise-tags=tag:nexus-prod --ssh=false
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow in on tailscale0 to any port 22 proto tcp
  - ufw allow 41641/udp
  - ufw --force enable
  - sshd -t
  - systemctl reload ssh || systemctl reload ssh.socket || systemctl restart ssh
  - systemctl restart systemd-journald
  - systemctl enable --now docker
