name: Clean generated Nexus web build
description: Remove the exact runner-owned Next.js output for the current checkout.

runs:
  using: composite
  steps:
    - name: Remove generated web build
      shell: bash
      run: |
        set -euo pipefail
        command -v mountpoint >/dev/null
        checkout="$(realpath -e -- "$GITHUB_WORKSPACE")"
        repository_root="$(realpath -e -- "$(git -C "$checkout" rev-parse --show-toplevel)")"
        build="$checkout/apps/web/.next"

        test "$checkout" = "$repository_root"
        test "$(stat -c '%u' -- "$checkout")" = "$(id -u)"
        test -d "$checkout/apps/web"
        test ! -L "$checkout/apps/web"
        test "$(realpath -e -- "$checkout/apps/web")" = "$checkout/apps/web"
        test "$(stat -c '%u' -- "$checkout/apps/web")" = "$(id -u)"
        git -C "$checkout" check-ignore --quiet -- apps/web/.next/

        if [ -e "$build" ] || [ -L "$build" ]; then
          test -d "$build"
          test ! -L "$build"
          test "$(realpath -e -- "$build")" = "$build"
          ! mountpoint --quiet -- "$build"
          test "$(stat -c '%u' -- "$build")" = "$(id -u)"
          git -C "$checkout" clean -qfdx -- apps/web/.next
        fi
        test ! -e "$build"
        test ! -L "$build"
