name: Set up Nexus test toolchain
description: Install the locked toolchain and dependencies used by ./scripts/test.

inputs:
  android:
    description: Prepare the preinstalled JDK and Gradle cache for Android proof.
    required: false
    default: "false"
  llm-tools:
    description: Prepare the pinned llm-tools checkout used by full and higher gates.
    required: false
    default: "false"
  provider-runtime:
    description: Prepare the pinned provider-runtime checkout used by full and higher gates.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Qualify host ownership proofs
      shell: bash
      run: |
        set -euo pipefail
        if [ "$(id -u)" -ne 0 ]; then
          sudo --non-interactive true
        fi

    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: "1.24"

    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "22"

    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: "0.12.1"
        enable-cache: true
        cache-local-path: ${{ runner.temp }}/nexus-uv-cache-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        cache-suffix: nexus-offline-complete-v1
        prune-cache: false
        cache-dependency-glob: |
          python/uv.lock
          ../llm-calling/uv.lock
          ../llm-tools/uv.lock

    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version-file: .bun-version

    - name: Install platform static tools
      shell: bash
      run: |
        set -euo pipefail
        missing=()
        for tool in cloud-init shellcheck; do
          command -v "$tool" >/dev/null 2>&1 || missing+=("$tool")
        done
        if [ "${#missing[@]}" -eq 0 ]; then
          echo "platform static tools already present"
          exit 0
        fi
        if ! sudo -n true >/dev/null 2>&1; then
          echo "::warning::missing ${missing[*]} and no passwordless sudo on this runner"
          exit 0
        fi
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends "${missing[@]}"

    # Static Dockerfile checks need Buildx, not a private BuildKit daemon. The
    # engine driver avoids a per-job volume on the persistent test runner.
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      with:
        driver: docker

    - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
      with:
        version: 2.112.0

    - name: Verify the pinned Bun and Supabase CLIs
      shell: bash
      run: |
        test "$(bun --version)" = "$(cat .bun-version)"
        test "$(supabase --version | sed -n '1p')" = "2.112.0"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-test-${{ hashFiles('apps/web/bun.lock', 'node/ingest/bun.lock') }}
        restore-keys: ${{ runner.os }}-bun-test-

    - name: Install actionlint
      shell: bash
      run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.8

    - name: Recreate generated web build
      uses: ./.github/actions/clean-generated-web-build

    - name: Recreate locked Python environment
      shell: bash
      run: |
        set -euo pipefail
        command -v mountpoint >/dev/null
        checkout="$(realpath -e -- "$GITHUB_WORKSPACE")"
        repository_root="$(realpath -e -- "$(git -C "$checkout" rev-parse --show-toplevel)")"
        environment="$checkout/python/.venv"

        test "$checkout" = "$repository_root"
        test "$(stat -c '%u' -- "$checkout")" = "$(id -u)"
        test -d "$checkout/python"
        test ! -L "$checkout/python"
        test "$(realpath -e -- "$checkout/python")" = "$checkout/python"
        test "$(stat -c '%u' -- "$checkout/python")" = "$(id -u)"
        git -C "$checkout" check-ignore --quiet -- python/.venv

        if [ -e "$environment" ] || [ -L "$environment" ]; then
          test -d "$environment"
          test ! -L "$environment"
          test "$(realpath -e -- "$environment")" = "$environment"
          ! mountpoint --quiet -- "$environment"
          if ! rm --recursive --force --one-file-system -- "$environment"; then
            sudo --non-interactive rm --recursive --force --one-file-system -- "$environment"
          fi
        fi
        test ! -e "$environment"
        test ! -L "$environment"

    - name: Install locked Python dependencies
      shell: bash
      run: uv sync --all-extras --locked --directory python

    - name: Install locked JavaScript dependencies
      shell: bash
      run: |
        bun install --frozen-lockfile --cwd apps/web
        bun install --frozen-lockfile --cwd node/ingest

    - name: Resolve Playwright version
      id: playwright
      shell: bash
      run: |
        version="$(cd apps/web && bunx --no-install playwright --version | awk '{print $2}')"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

    - name: Install Chromium and its system dependencies
      shell: bash
      run: cd apps/web && flock -x /tmp/nexus-test-chromium.lock bunx --no-install playwright install --with-deps chromium

    - name: Prepare pinned external Python suites
      if: inputs.provider-runtime == 'true' || inputs.llm-tools == 'true'
      shell: bash
      env:
        PREPARE_LLM_TOOLS: ${{ inputs.llm-tools }}
        PREPARE_PROVIDER_RUNTIME: ${{ inputs.provider-runtime }}
      run: |
        set -euo pipefail
        prepare_pinned_suite() {
          local package="$1"
          local repository="$2"
          local checkout="$3"
          local revision
          revision="$(sed -n "s/^${package}.*rev = \"\([0-9a-f]*\)\".*/\1/p" python/pyproject.toml)"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          checkout="$(realpath -m -- "$checkout")"
          local checkout_parent
          checkout_parent="$(realpath -e -- "$GITHUB_WORKSPACE/..")"
          case "$checkout" in
            "$checkout_parent/llm-calling"|"$checkout_parent/llm-tools") ;;
            *)
              echo "external suite checkout escaped the runner workspace" >&2
              exit 1
              ;;
          esac
          if [ -e "$checkout" ] || [ -L "$checkout" ]; then
            if [ -L "$checkout" ] \
              || [ ! -d "$checkout" ] \
              || [ "$(stat -c '%u' -- "$checkout")" != "$(id -u)" ]; then
              echo "external suite checkout is not a runner-owned directory" >&2
              exit 1
            fi
            rm --recursive --force --one-file-system -- "$checkout"
          fi
          git clone --filter=blob:none --no-checkout "$repository" "$checkout"
          git -C "$checkout" checkout --detach "$revision"
          test "$(git -C "$checkout" rev-parse HEAD)" = "$revision"
          uv sync --all-extras --locked --directory "$checkout"
        }
        if [ "$PREPARE_PROVIDER_RUNTIME" = "true" ]; then
          prepare_pinned_suite \
            provider-runtime \
            "https://github.com/NielsdaWheelz/llm-calling.git" \
            "$GITHUB_WORKSPACE/../llm-calling"
        fi
        if [ "$PREPARE_LLM_TOOLS" = "true" ]; then
          prepare_pinned_suite \
            llm-tools \
            "https://github.com/NielsdaWheelz/llm-tools.git" \
            "$GITHUB_WORKSPACE/../llm-tools"
        fi

    - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
      if: inputs.android == 'true'
      with:
        distribution: temurin
        java-version: "21"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.android == 'true'
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-android-${{ hashFiles('apps/android/**/*.gradle*', 'apps/android/gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: ${{ runner.os }}-gradle-android-
