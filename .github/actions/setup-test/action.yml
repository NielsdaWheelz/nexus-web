name: Set up Nexus test toolchain
description: Install the locked toolchain and dependencies used by ./scripts/test.

inputs:
  android:
    description: Prepare the preinstalled JDK and Gradle cache for Android proof.
    required: false
    default: "false"
  llm-tools:
    description: Prepare the pinned llm-tools checkout used by full and higher gates.
    required: false
    default: "false"
  provider-runtime:
    description: Prepare the pinned provider-runtime checkout used by full and higher gates.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: "1.25.1"

    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "22"

    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: "0.12.1"
        enable-cache: true
        cache-local-path: ${{ runner.temp }}/nexus-uv-cache-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        cache-suffix: nexus-offline-complete-v1
        prune-cache: false
        cache-dependency-glob: |
          python/uv.lock
          ../llm-calling/uv.lock
          ../llm-tools/uv.lock

    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version-file: .bun-version

    # The protected release job runs on a persistent self-hosted host that may
    # already carry these tools and may not grant passwordless sudo. Install
    # only what is missing, and never crash setup: a genuinely absent tool is
    # reported by the control plane as a fail-closed `not_run`, which is a
    # verdict, whereas a setup crash produces no evidence at all.
    - name: Install platform static tools
      shell: bash
      run: |
        set -euo pipefail
        missing=()
        for tool in cloud-init shellcheck; do
          command -v "$tool" >/dev/null 2>&1 || missing+=("$tool")
        done
        if [ "${#missing[@]}" -eq 0 ]; then
          echo "platform static tools already present"
          exit 0
        fi
        if ! sudo -n true >/dev/null 2>&1; then
          echo "::warning::missing ${missing[*]} and no passwordless sudo on this runner"
          exit 0
        fi
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends "${missing[@]}"

    - name: Detect container runtime
      id: container
      shell: bash
      run: |
        set -euo pipefail
        if command -v docker >/dev/null 2>&1; then
          echo "docker=true" >> "$GITHUB_OUTPUT"
        else
          echo "docker=false" >> "$GITHUB_OUTPUT"
          echo "::warning::docker is absent; container-backed proof will be reported as not_run"
        fi

    # Static Dockerfile checks use the engine without a separate BuildKit volume.
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      if: steps.container.outputs.docker == 'true'
      with:
        driver: docker

    - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
      with:
        version: 2.112.0

    - name: Verify the pinned Bun and Supabase CLIs
      shell: bash
      run: |
        test "$(bun --version)" = "$(cat .bun-version)"
        test "$(supabase --version | sed -n '1p')" = "2.112.0"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-test-${{ hashFiles('apps/web/bun.lock', 'node/ingest/bun.lock') }}
        restore-keys: ${{ runner.os }}-bun-test-

    - name: Install actionlint
      shell: bash
      run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.8

    - name: Install pinned Caddy process proof owner
      shell: bash
      run: |
        go install github.com/caddyserver/caddy/v2/cmd/caddy@v2.11.4
        caddy_bin="$(go env GOPATH)/bin/caddy"
        go version -m "$caddy_bin" \
          | grep -F $'\tmod\tgithub.com/caddyserver/caddy/v2\tv2.11.4\t'
        "$caddy_bin" version >/dev/null
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

    - name: Recreate generated web build
      uses: ./.github/actions/clean-generated-web-build

    - name: Recreate locked Python environment
      shell: bash
      run: |
        set -euo pipefail
        command -v mountpoint >/dev/null
        checkout="$(realpath -e -- "$GITHUB_WORKSPACE")"
        repository_root="$(realpath -e -- "$(git -C "$checkout" rev-parse --show-toplevel)")"
        environment="$checkout/python/.venv"

        test "$checkout" = "$repository_root"
        test "$(stat -c '%u' -- "$checkout")" = "$(id -u)"
        test -d "$checkout/python"
        test ! -L "$checkout/python"
        test "$(realpath -e -- "$checkout/python")" = "$checkout/python"
        test "$(stat -c '%u' -- "$checkout/python")" = "$(id -u)"
        git -C "$checkout" check-ignore --quiet -- python/.venv

        if [ -e "$environment" ] || [ -L "$environment" ]; then
          test -d "$environment"
          test ! -L "$environment"
          test "$(realpath -e -- "$environment")" = "$environment"
          ! mountpoint --quiet -- "$environment"
          if ! rm --recursive --force --one-file-system -- "$environment"; then
            sudo --non-interactive rm --recursive --force --one-file-system -- "$environment"
          fi
        fi
        test ! -e "$environment"
        test ! -L "$environment"

    - name: Install locked Python dependencies
      shell: bash
      run: uv sync --all-extras --locked --directory python

    # The background worker's cgroup proofs need a rootless systemd user manager.
    # The hosted runner must be provisioned; the protected self-hosted host may
    # already carry one and may not grant passwordless sudo. Provision only what
    # is missing and never crash setup: `doctor` reports an unusable delegate as
    # a fail-closed verdict, whereas a setup crash produces no evidence at all.
    - name: Provision the rootless systemd cgroup delegate
      shell: bash
      run: |
        set -euo pipefail
        runtime_dir="/run/user/$(id -u)"
        if [ ! -S "$runtime_dir/bus" ]; then
          if ! sudo -n true >/dev/null 2>&1; then
            echo "::warning::no user systemd bus at $runtime_dir/bus and no passwordless sudo on this runner"
            exit 0
          fi
          if ! dpkg-query --show dbus-user-session >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends dbus-user-session
          fi
          sudo loginctl enable-linger "$(id -un)"
          attempts=0
          while [ ! -S "$runtime_dir/bus" ] && [ "$attempts" -lt 100 ]; do
            sleep 0.2
            attempts=$((attempts + 1))
          done
        fi
        if [ ! -S "$runtime_dir/bus" ]; then
          echo "::warning::the user systemd bus did not appear at $runtime_dir/bus"
          exit 0
        fi
        {
          echo "XDG_RUNTIME_DIR=$runtime_dir"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$runtime_dir/bus"
        } >> "$GITHUB_ENV"
        PYTHONPATH=python python/.venv/bin/python -c \
          'from nexus_test_control.services import cgroup_delegate_failure; diagnostic = cgroup_delegate_failure(); print(f"::warning::{diagnostic}" if diagnostic else "user-systemd cgroup delegate ready")'

    - name: Install locked JavaScript dependencies
      shell: bash
      run: |
        bun install --frozen-lockfile --cwd apps/web
        bun install --frozen-lockfile --cwd node/ingest

    - name: Resolve Playwright version
      id: playwright
      shell: bash
      run: |
        version="$(cd apps/web && bunx --no-install playwright --version | awk '{print $2}')"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

    - name: Install Chromium and its system dependencies
      shell: bash
      run: cd apps/web && flock -x /tmp/nexus-test-chromium.lock bunx --no-install playwright install --with-deps chromium

    - name: Prepare pinned external Python suites
      if: inputs.provider-runtime == 'true' || inputs.llm-tools == 'true'
      shell: bash
      env:
        PREPARE_LLM_TOOLS: ${{ inputs.llm-tools }}
        PREPARE_PROVIDER_RUNTIME: ${{ inputs.provider-runtime }}
      run: |
        set -euo pipefail
        prepared_suites=()
        prepare_pinned_suite() {
          local package="$1"
          local repository="$2"
          local checkout="$3"
          local revision
          revision="$(sed -n "s/^${package}.*rev = \"\([0-9a-f]*\)\".*/\1/p" python/pyproject.toml)"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          case "$(basename "$checkout")" in
            llm-calling|llm-tools) ;;
            *) exit 1 ;;
          esac
          rm -rf "$checkout"
          git clone --filter=blob:none --no-checkout "$repository" "$checkout"
          git -C "$checkout" checkout --detach "$revision"
          test "$(git -C "$checkout" rev-parse HEAD)" = "$revision"
          prepared_suites+=(--suite "$package")
        }
        if [ "$PREPARE_PROVIDER_RUNTIME" = "true" ]; then
          prepare_pinned_suite \
            provider-runtime \
            "https://github.com/NielsdaWheelz/llm-calling.git" \
            "$GITHUB_WORKSPACE/../llm-calling"
        fi
        if [ "$PREPARE_LLM_TOOLS" = "true" ]; then
          prepare_pinned_suite \
            llm-tools \
            "https://github.com/NielsdaWheelz/llm-tools.git" \
            "$GITHUB_WORKSPACE/../llm-tools"
        fi
        # Use the same owner as local setup. It hydrates the exact archived
        # source shape consumed by the controller and proves that a fresh venv
        # can subsequently be materialized with networking disabled.
        PYTHONPATH="$GITHUB_WORKSPACE/python" \
          "$GITHUB_WORKSPACE/python/.venv/bin/python" \
          -m nexus_test_control.setup_dependencies \
          --repo-root "$GITHUB_WORKSPACE" \
          "${prepared_suites[@]}"

    - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
      if: inputs.android == 'true'
      with:
        distribution: temurin
        java-version: "21"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.android == 'true'
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-android-${{ hashFiles('apps/android/**/*.gradle*', 'apps/android/gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: ${{ runner.os }}-gradle-android-
