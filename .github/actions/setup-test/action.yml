name: Set up Nexus test toolchain
description: Install the locked toolchain and dependencies used by ./scripts/test.

inputs:
  android:
    description: Prepare the preinstalled JDK and Gradle cache for Android proof.
    required: false
    default: "false"
  provider-runtime:
    description: Prepare the pinned provider-runtime checkout used by full and higher gates.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: "1.24"

    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "22"

    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: "0.12.1"
        enable-cache: true
        prune-cache: true
        cache-dependency-glob: |
          python/uv.lock
          ../llm-calling/uv.lock

    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

    - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
      with:
        version: 2.90.0

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-test-${{ hashFiles('apps/web/bun.lock', 'node/ingest/bun.lock') }}
        restore-keys: ${{ runner.os }}-bun-test-

    - name: Install actionlint
      shell: bash
      run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.8

    - name: Install locked Python dependencies
      shell: bash
      run: uv sync --all-extras --locked --directory python

    - name: Install locked JavaScript dependencies
      shell: bash
      run: |
        bun install --frozen-lockfile --cwd apps/web
        bun install --frozen-lockfile --cwd node/ingest

    - name: Resolve Playwright version
      id: playwright
      shell: bash
      run: |
        version="$(cd apps/web && bunx --no-install playwright --version | awk '{print $2}')"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

    - name: Install Chromium and its system dependencies
      shell: bash
      run: cd apps/web && flock -x /tmp/nexus-test-chromium.lock bunx --no-install playwright install --with-deps chromium

    - name: Prepare pinned provider-runtime checkout
      if: inputs.provider-runtime == 'true'
      shell: bash
      run: |
        set -euo pipefail
        revision="$(sed -n 's/^provider-runtime.*rev = "\([0-9a-f]*\)".*/\1/p' python/pyproject.toml)"
        test "${#revision}" -eq 40
        checkout="$GITHUB_WORKSPACE/../llm-calling"
        test ! -e "$checkout"
        git clone --filter=blob:none --no-checkout https://github.com/NielsdaWheelz/llm-calling.git "$checkout"
        git -C "$checkout" checkout --detach "$revision"
        test "$(git -C "$checkout" rev-parse HEAD)" = "$revision"
        uv sync --all-extras --locked --directory "$checkout"

    - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
      if: inputs.android == 'true'
      with:
        distribution: temurin
        java-version: "21"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.android == 'true'
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-android-${{ hashFiles('apps/android/**/*.gradle*', 'apps/android/gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: ${{ runner.os }}-gradle-android-
