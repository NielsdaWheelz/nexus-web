name: Protected release verification

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing android-v* git tag to verify and publish as a draft.
        required: true
        type: string
      publish_stable:
        description: Publish the verified draft as the latest stable release.
        required: false
        default: false
        type: boolean
      version_code:
        description: Monotonically increasing positive Android version code.
        required: true
        type: number
      bootstrap_no_device:
        description: >-
          Skip the signed-physical device stages. Only for the bootstrap
          release, while no published release carries offline reading;
          requires previous_version_code.
        required: false
        default: false
        type: boolean
      previous_version_code:
        description: >-
          Published stable Android version code the bootstrap release
          supersedes (used only with bootstrap_no_device).
        required: false
        default: 0
        type: number

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    # The signed release runs on the protected lab runner with the dedicated
    # USB handset. The explicit bootstrap release is the one exception: no
    # handset exists anywhere, so it runs hosted and boots its own emulator.
    runs-on: ${{ inputs.bootstrap_no_device && 'ubuntu-latest' || fromJSON('["self-hosted", "linux", "x64", "nexus-android-usb"]') }}
    timeout-minutes: 360
    environment: android-release
    env:
      ANDROID_RELEASE_TAG: ${{ inputs.tag }}
      ANDROID_PUBLISH_STABLE: ${{ inputs.publish_stable }}
      NEXUS_ANDROID_RELEASE_BASE_URL: ${{ vars.NEXUS_ANDROID_RELEASE_BASE_URL }}
      NEXUS_ANDROID_RELEASE_OWNED_HOST: ${{ vars.NEXUS_ANDROID_RELEASE_OWNED_HOST }}
      NEXUS_ANDROID_RELEASE_API_ORIGIN: ${{ vars.NEXUS_ANDROID_RELEASE_API_ORIGIN }}
      NEXUS_ANDROID_RELEASE_CERT_SHA256: ${{ secrets.NEXUS_ANDROID_RELEASE_CERT_SHA256 }}
      NEXUS_ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.NEXUS_ANDROID_RELEASE_KEY_ALIAS }}
      NEXUS_ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.NEXUS_ANDROID_RELEASE_KEY_PASSWORD }}
      NEXUS_ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.NEXUS_ANDROID_RELEASE_STORE_PASSWORD }}
      NEXUS_GOOGLE_WEB_CLIENT_ID: ${{ vars.NEXUS_GOOGLE_WEB_CLIENT_ID }}
      # Non-secret identifiers only. The older physical baseline is pre-authenticated
      # by the protected lab operator; no browser session/cookie crosses a command line.
      NEXUS_ANDROID_RELEASE_PROMOTION_ACCOUNT_ID: ${{ vars.NEXUS_ANDROID_RELEASE_PROMOTION_ACCOUNT_ID }}
      NEXUS_ANDROID_RELEASE_PROMOTION_PDF_MEDIA_ID: ${{ vars.NEXUS_ANDROID_RELEASE_PROMOTION_PDF_MEDIA_ID }}
      NEXUS_ANDROID_RELEASE_PROMOTION_EPUB_MEDIA_ID: ${{ vars.NEXUS_ANDROID_RELEASE_PROMOTION_EPUB_MEDIA_ID }}
      NEXUS_ANDROID_RELEASE_PROMOTION_ARTICLE_MEDIA_ID: ${{ vars.NEXUS_ANDROID_RELEASE_PROMOTION_ARTICLE_MEDIA_ID }}
      NEXUS_ANDROID_VERSION_CODE: ${{ inputs.version_code }}
      NEXUS_ANDROID_RELEASE_BOOTSTRAP_NO_DEVICE: ${{ inputs.bootstrap_no_device }}
      NEXUS_ANDROID_PREVIOUS_VERSION_CODE: ${{ inputs.previous_version_code }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      NEXUS_PROVIDER_CERTIFICATION: "1"
      NEXUS_FABLE_RETENTION_ACCEPTED_AT: ${{ secrets.NEXUS_FABLE_RETENTION_ACCEPTED_AT }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag
        run: |
          set -euo pipefail
          if [[ ! "$ANDROID_RELEASE_TAG" == android-v* ]]; then
            echo "Android releases must use an android-v* git tag."
            exit 1
          fi
          tag_commit="$(git rev-parse "$ANDROID_RELEASE_TAG^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [ "$tag_commit" != "$head_commit" ]; then
            echo "Checked-out commit does not match $ANDROID_RELEASE_TAG."
            exit 1
          fi
          version_name="${ANDROID_RELEASE_TAG#android-v}"
          test -n "$version_name"
          echo "NEXUS_ANDROID_VERSION_NAME=$version_name" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup-test
        with:
          android: "true"
          llm-tools: "true"
          provider-runtime: "true"

      - name: Boot the bootstrap emulator
        if: inputs.bootstrap_no_device
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          avdmanager="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          adb="$ANDROID_HOME/platform-tools/adb"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" --install \
            "platform-tools" \
            "emulator" \
            "system-images;android-36;google_apis;x86_64" >/dev/null
          echo no | "$avdmanager" create avd \
            --name nexus-bootstrap \
            --package "system-images;android-36;google_apis;x86_64" \
            --force >/dev/null
          nohup "$ANDROID_HOME/emulator/emulator" -avd nexus-bootstrap \
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim \
            -no-snapshot -camera-back none -camera-front none \
            >"$RUNNER_TEMP/emulator.log" 2>&1 &
          "$adb" wait-for-device
          for _ in $(seq 1 120); do
            if [ "$("$adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              break
            fi
            sleep 5
          done
          test "$("$adb" shell getprop sys.boot_completed | tr -d '\r')" = "1"
          "$adb" shell input keyevent 82
          "$adb" devices -l

      - name: Decode release keystore
        env:
          NEXUS_ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.NEXUS_ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$NEXUS_ANDROID_RELEASE_KEYSTORE_BASE64"
          printf '%s' "$NEXUS_ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nexus-release.jks"
          chmod 600 "$RUNNER_TEMP/nexus-release.jks"
          echo "NEXUS_ANDROID_RELEASE_STORE_FILE=$RUNNER_TEMP/nexus-release.jks" >> "$GITHUB_ENV"

      - name: Protected release gate
        run: ./scripts/test release

      - name: Create or update verified draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="Signed Nexus Android APK. Provider certification, signature verification, staged real-API offline-reading acquisition on the older USB baseline, reboot/airplane-mode cold shelf, in-place V1 reopen/progress/purge, local App Link routing, and native auth handoff passed before this draft was created."
          if [ "$NEXUS_ANDROID_RELEASE_BOOTSTRAP_NO_DEVICE" = "true" ]; then
            notes="Signed Nexus Android APK. Provider certification, signature verification, the manifest/player-protocol contract, the pinned API origin, and the Android device suite passed before this draft was created. The signed-physical USB baseline stages were explicitly skipped (bootstrap_no_device): no published release carries offline reading, so no in-the-wild offline state exists for them to protect. The operator device smoke follows the production deploy."
          fi
          upload_args=()
          if gh release view "$ANDROID_RELEASE_TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$ANDROID_RELEASE_TAG" --json isDraft --jq .isDraft)" = "true" ]; then
              upload_args+=(--clobber)
            else
              echo "Refusing to replace an already-published release."
              exit 1
            fi
          else
            gh release create "$ANDROID_RELEASE_TAG" \
              --verify-tag \
              --draft \
              --title "$ANDROID_RELEASE_TAG" \
              --notes "$notes"
          fi
          release_dirs=(test-results/runs/*/release)
          if [ "${#release_dirs[@]}" -ne 1 ] || [ ! -d "${release_dirs[0]}" ]; then
            echo "Expected exactly one control-plane-owned release directory."
            exit 1
          fi
          release_dir="${release_dirs[0]}"
          android_version="${ANDROID_RELEASE_TAG#android-v}"
          gh release upload "$ANDROID_RELEASE_TAG" \
            "$release_dir/nexus-android.apk" \
            "$release_dir/nexus-android.apk.sha256" \
            "$release_dir/nexus-android-$android_version.apk" \
            "$release_dir/nexus-android-$android_version.apk.sha256" \
            "$release_dir/release-manifest.json" \
            "${upload_args[@]}"

      - name: Publish stable release
        if: inputs.publish_stable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$(gh release view "$ANDROID_RELEASE_TAG" --json isDraft --jq .isDraft)" != "true" ]; then
            echo "Only draft Android releases can be published by this workflow."
            exit 1
          fi
          release_id="$(gh release view "$ANDROID_RELEASE_TAG" --json databaseId --jq .databaseId)"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false \
            -F prerelease=false \
            -f make_latest=true

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nexus-test-release-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 30
