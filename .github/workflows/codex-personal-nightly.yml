name: Codex Personal Metadata Nightly

on:
  schedule:
    - cron: "41 9 * * *"
  workflow_dispatch:

concurrency:
  group: codex-personal-metadata-nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  codex-personal-metadata:
    # This label is a private VM runner with its own pre-enrolled `codex-personal`
    # state root. Authentication never enters GitHub secrets or workflow output.
    runs-on: [self-hosted, linux, nexus-codex-nightly]
    timeout-minutes: 20
    environment: nexus-codex-nightly
    env:
      NEXUS_CODEX_HOSTED_CANARY: "1"
      NEXUS_CODEX_HOSTED_PROFILE: codex-personal
      NEXUS_CODEX_HOSTED_STATE_ROOT: /var/lib/nexus-codex-nightly/state
      NEXUS_CODEX_HOSTED_WORKING_DIRECTORY: /var/lib/nexus-codex-nightly/cwd

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-test

      - name: Verify dedicated subscription state boundary
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID:$VERSION_ID" = "ubuntu:24.04"
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
          test "$(stat -c '%u:%g:%a' /etc/apparmor.d/nexus-codex-nightly-bwrap)" = "0:0:644"
          cmp deploy/hetzner/nexus-codex-nightly-bwrap.apparmor /etc/apparmor.d/nexus-codex-nightly-bwrap
          grep -q '^nexus-codex-nightly-bwrap ' /sys/kernel/security/apparmor/profiles
          test -d "$NEXUS_CODEX_HOSTED_STATE_ROOT"
          test -d "$NEXUS_CODEX_HOSTED_WORKING_DIRECTORY"
          test "$(stat -c '%u:%a' "$NEXUS_CODEX_HOSTED_STATE_ROOT")" = "$(id -u):700"
          test "$(stat -c '%u:%a' "$NEXUS_CODEX_HOSTED_WORKING_DIRECTORY")" = "$(id -u):700"
          test -z "$(find "$NEXUS_CODEX_HOSTED_WORKING_DIRECTORY" -mindepth 1 -print -quit)"

      - name: Verify bundled Codex Linux sandbox
        run: python/.venv/bin/python -m apps.codex_agent.sandbox_health

      - name: Run protected Codex subscription metadata canary
        run: ./scripts/test codex-nightly

      - name: Upload Codex nightly evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nexus-codex-nightly-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
