name: Codex Personal Generation Nightly

on:
  schedule:
    - cron: "41 9 * * *"
  workflow_dispatch:

concurrency:
  group: codex-personal-generation-nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  codex-personal-generation:
    # This label is a private VM runner with its own pre-enrolled `codex-personal`
    # state root. Authentication never enters GitHub secrets or workflow output.
    runs-on: [self-hosted, linux, nexus-codex-nightly]
    # Nine bounded target/background turns may each consume their declared
    # 600-second ceiling. Keep thirty additional minutes for locked setup,
    # bounded artifact delivery, and disposable-state scrubbing.
    timeout-minutes: 120
    environment: nexus-codex-nightly
    env:
      NEXUS_CODEX_HOSTED_CANARY: "1"
      NEXUS_CODEX_HOSTED_PROFILE: codex-personal
      NEXUS_CODEX_HOSTED_STATE_ROOT: /var/lib/nexus-codex-nightly/state
      NEXUS_CODEX_HOSTED_TEMPORARY_DIRECTORY: /var/lib/nexus-codex-nightly/tmp
      NEXUS_CODEX_HOSTED_WORKING_DIRECTORY: /var/lib/nexus-codex-nightly/cwd
      NEXUS_CODEX_HOSTED_SOURCE_SHA: ${{ github.sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"

      - name: Install locked Codex canary environment
        run: uv sync --frozen --no-editable --extra codex-agent --extra dev --directory python

      - name: Verify dedicated subscription state boundary
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID:$VERSION_ID" = "ubuntu:24.04"
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
          test "$(stat -c '%u:%g:%a' /etc/apparmor.d/nexus-codex-nightly-bwrap)" = "0:0:644"
          cmp deploy/hetzner/nexus-codex-nightly-bwrap.apparmor /etc/apparmor.d/nexus-codex-nightly-bwrap
          test -d "$NEXUS_CODEX_HOSTED_STATE_ROOT"
          test -d "$NEXUS_CODEX_HOSTED_TEMPORARY_DIRECTORY"
          test -d "$NEXUS_CODEX_HOSTED_WORKING_DIRECTORY"
          test "$(stat -c '%u:%a' "$NEXUS_CODEX_HOSTED_STATE_ROOT")" = "$(id -u):700"
          test "$(stat -c '%u:%a' "$NEXUS_CODEX_HOSTED_TEMPORARY_DIRECTORY")" = "$(id -u):700"
          test "$(stat -c '%u:%a' "$NEXUS_CODEX_HOSTED_WORKING_DIRECTORY")" = "$(id -u):700"
          test "$(stat -c '%d' "$NEXUS_CODEX_HOSTED_STATE_ROOT")" = "$(stat -c '%d' "$NEXUS_CODEX_HOSTED_TEMPORARY_DIRECTORY")"
          test "$(stat -c '%d' "$NEXUS_CODEX_HOSTED_STATE_ROOT")" = "$(stat -c '%d' "$NEXUS_CODEX_HOSTED_WORKING_DIRECTORY")"
          test -z "$(find "$NEXUS_CODEX_HOSTED_TEMPORARY_DIRECTORY" -mindepth 1 -print -quit)"
          test -z "$(find "$NEXUS_CODEX_HOSTED_WORKING_DIRECTORY" -mindepth 1 -print -quit)"

      - name: Verify bundled Codex Linux sandbox
        run: |
          NEXUS_CODEX_WORKING_DIRECTORY_ROOT="$NEXUS_CODEX_HOSTED_WORKING_DIRECTORY" \
            python/.venv/bin/python -m apps.codex_agent.sandbox_health

      - name: Run protected Codex subscription generation canary
        id: canary
        run: ./scripts/test codex-nightly

      - name: Scrub disposable Codex nightly state
        if: always()
        run: |
          set -euo pipefail
          test "$NEXUS_CODEX_HOSTED_TEMPORARY_DIRECTORY" = /var/lib/nexus-codex-nightly/tmp
          test "$NEXUS_CODEX_HOSTED_WORKING_DIRECTORY" = /var/lib/nexus-codex-nightly/cwd
          find "$NEXUS_CODEX_HOSTED_TEMPORARY_DIRECTORY" -mindepth 1 -delete
          find "$NEXUS_CODEX_HOSTED_WORKING_DIRECTORY" -mindepth 1 -delete
          test -z "$(find "$NEXUS_CODEX_HOSTED_TEMPORARY_DIRECTORY" -mindepth 1 -print -quit)"
          test -z "$(find "$NEXUS_CODEX_HOSTED_WORKING_DIRECTORY" -mindepth 1 -print -quit)"

      - name: Stage bounded Codex nightly artifact
        if: always()
        env:
          CANARY_OUTCOME: ${{ steps.canary.outcome }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          umask 077
          readonly ARTIFACT="${RUNNER_TEMP}/nexus-codex-nightly-${GITHUB_RUN_ID}.json"
          printf '%s\n' \
            "{\"schema_version\":\"nexus-hosted-codex-canary-failure.v1\",\"github_run_id\":${GITHUB_RUN_ID},\"status\":\"failed\"}" \
            > "$ARTIFACT"
          evidence_files=()
          while IFS= read -r evidence_file; do
            evidence_files[${#evidence_files[@]}]="$evidence_file"
          done < <(
            find test-results/runs -type f -name hosted-codex-personal-generation.json -print 2>/dev/null \
              | LC_ALL=C sort
          )
          readiness_files=()
          while IFS= read -r readiness_file; do
            readiness_files[${#readiness_files[@]}]="$readiness_file"
          done < <(
            find test-results/runs -type f -name hosted-codex-personal-readiness.json -print 2>/dev/null \
              | LC_ALL=C sort
          )
          if [ "$CANARY_OUTCOME" = success ] && [ "${#evidence_files[@]}" = 1 ] && [ "${#readiness_files[@]}" = 0 ]; then
            python/.venv/bin/python -m nexus.ops.codex_hosted_evidence \
              stage "${evidence_files[0]}" "$ARTIFACT" "$GITHUB_SHA"
            exit 0
          fi
          if [ "${#evidence_files[@]}" = 0 ] && [ "${#readiness_files[@]}" = 1 ]; then
            python/.venv/bin/python -m nexus.ops.codex_hosted_evidence \
              stage-readiness "${readiness_files[0]}" "$ARTIFACT" "$GITHUB_RUN_ID"
            exit 0
          fi
          [ "$CANARY_OUTCOME" != success ] || exit 1

      - name: Upload bounded Codex nightly artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nexus-codex-nightly-${{ github.run_id }}
          path: ${{ runner.temp }}/nexus-codex-nightly-${{ github.run_id }}.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce successful Codex nightly qualification
        if: always()
        env:
          CANARY_OUTCOME: ${{ steps.canary.outcome }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          readonly ARTIFACT="${RUNNER_TEMP}/nexus-codex-nightly-${GITHUB_RUN_ID}.json"
          python/.venv/bin/python -m nexus.ops.codex_hosted_evidence \
            gate "$ARTIFACT" "$CANARY_OUTCOME" "$GITHUB_SHA"
