name: Nightly verification

# Intentionally manual until the protected nexus-nightly environment has every
# hosted credential and an Android-capable runner. A missing requirement is a
# fail-closed not_run result from the control plane, never a skipped success.
on:
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: nexus-nightly
    env:
      NEXUS_HOSTED_CANARY: "1"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      NEXUS_GOOGLE_WEB_CLIENT_ID: ${{ vars.NEXUS_GOOGLE_WEB_CLIENT_ID || 'nexus-test.apps.googleusercontent.com' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-test
        with:
          android: "true"
          provider-runtime: "true"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run nightly with its Android device attached
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: ./scripts/test nightly

      - name: Upload nightly evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nexus-test-nightly-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
