name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: devbox check
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: write the private memory deploy key
        shell: bash
        env:
          UNIVERSAL_MEMORY_DEPLOY_KEY: ${{ secrets.UNIVERSAL_MEMORY_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          test -n "$UNIVERSAL_MEMORY_DEPLOY_KEY"
          umask 077
          # gh secret set strips the final newline; OpenSSH 9.2 refuses the key without it.
          printf '%s\n' "$UNIVERSAL_MEMORY_DEPLOY_KEY" >"$RUNNER_TEMP/universal-memory-deploy-key"

      - name: install locked dependencies
        shell: bash
        env:
          CI: "true"
          UNIVERSAL_MEMORY_DEPLOY_KEY_FILE: ${{ runner.temp }}/universal-memory-deploy-key
        run: |
          set -euo pipefail
          test "$(bun --version)" = "$(cat .bun-version)"
          scripts/with-memory-git uv sync --extra dev --extra codex-agent --locked --directory python
          bun install --frozen-lockfile --cwd apps/web
          bun install --frozen-lockfile --cwd node/ingest

      - name: remove the private memory deploy key
        if: ${{ always() }}
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/universal-memory-deploy-key"

      - name: check
        run: ./scripts/test
