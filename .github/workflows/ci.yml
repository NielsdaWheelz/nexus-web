name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Open same-repository pull request number to recover.
        required: true
        type: string
      expected_head_sha:
        description: Exact 40-character lowercase pull-request head SHA.
        required: true
        type: string
      expected_base_sha:
        description: Exact 40-character lowercase main SHA used as merge base.
        required: true
        type: string

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pull_request_number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  pr:
    name: Deterministic PR proof
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    # GitHub-hosted runners are unavailable while the account's Actions
    # spending limit is exhausted; self-hosted minutes are not billed, so the
    # gate runs on the lab runner. Restore `ubuntu-latest` when billing allows.
    runs-on: [self-hosted, linux, x64]
    # A pull request proves its changed static paths plus the proofs its diff
    # affects; the deterministic `pr` portfolio with same-run sensitivity stays
    # the local pre-merge command, and `full` on the main push is the release
    # proof. A broad cutover can still select most of the portfolio here.
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: read
    env:
      NEXUS_TEST_BASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_base_sha || (github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before) }}

    steps:
      - name: Validate recovery input syntax
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          PR_NUMBER: ${{ inputs.pull_request_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "pull_request_number must be a canonical positive decimal" >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_head_sha must be a full lowercase Git SHA" >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_base_sha must be a full lowercase Git SHA" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/head', inputs.pull_request_number) || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          # A persistent self-hosted runner keeps the controller's untracked runtime
          # record beside its still-running test stack; wiping only the record makes
          # the next job re-provision onto foreign containers. Hosted runners are
          # fresh and clean fully.
          clean: ${{ runner.environment == 'github-hosted' }}

      - name: Construct the exact PR merge
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
          GIT_AUTHOR_NAME: Nexus CI
          GIT_AUTHOR_EMAIL: ci@nexus.local
          GIT_COMMITTER_NAME: Nexus CI
          GIT_COMMITTER_EMAIL: ci@nexus.local
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/nexus-pr-recovery.json"
          gh api \
            --method GET \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$response"
          jq -e --slurp \
            --argjson number "$PR_NUMBER" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg base_sha "$EXPECTED_BASE_SHA" \
            --arg head_sha "$EXPECTED_HEAD_SHA" \
            'length == 1
              and (.[0] | type) == "object"
              and .[0].number == $number
              and .[0].state == "open"
              and .[0].base.ref == "main"
              and .[0].base.sha == $base_sha
              and .[0].base.repo.full_name == $repository
              and .[0].head.sha == $head_sha
              and .[0].head.repo.full_name == $repository' \
            "$response" >/dev/null

          checked_out_head="$(git rev-parse HEAD)"
          fetched_main="$(git rev-parse refs/remotes/origin/main)"
          if [ "$checked_out_head" != "$EXPECTED_HEAD_SHA" ]; then
            echo "checked-out PR head does not match expected_head_sha" >&2
            exit 1
          fi
          if [ "$fetched_main" != "$EXPECTED_BASE_SHA" ]; then
            echo "fetched main does not match expected_base_sha" >&2
            exit 1
          fi

          git checkout --detach "$EXPECTED_BASE_SHA"
          git merge --no-ff --no-commit "$EXPECTED_HEAD_SHA"
          merge_timestamp="$(git show --no-patch --format=%cI "$EXPECTED_HEAD_SHA")"
          GIT_AUTHOR_DATE="$merge_timestamp" \
          GIT_COMMITTER_DATE="$merge_timestamp" \
            git commit --no-gpg-sign --message "Synthetic merge for PR #$PR_NUMBER"

          read -r merge_sha first_parent second_parent extra_parent <<EOF
          $(git rev-list --parents -n 1 HEAD)
          EOF
          if [ "$first_parent" != "$EXPECTED_BASE_SHA" ] \
            || [ "$second_parent" != "$EXPECTED_HEAD_SHA" ] \
            || [ -n "${extra_parent:-}" ]; then
            echo "synthetic merge parents do not match expected base then head" >&2
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$merge_sha" ]; then
            echo "synthetic merge identity changed during parent proof" >&2
            exit 1
          fi

      - uses: ./.github/actions/setup-test

      - name: Run the changed proof
        run: ./scripts/test changed --base "$NEXUS_TEST_BASE_SHA"

      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nexus-test-pr-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  candidate-full:
    name: Candidate full proof
    if: github.event_name == 'push'
    runs-on: [self-hosted, linux, x64]
    # The complete portfolio on the four-core lab runner exceeds the hosted
    # 90-minute budget (its kernel lane alone measured 60 minutes there);
    # self-hosted minutes are unbilled, so the bound is wide.
    timeout-minutes: 480
    permissions:
      contents: read

    steps:
      # The full stack fills the hosted runner's ~14GB to MinIO's minimum
      # free-drive threshold by the journeys phase (XMinioStorageFull refusing
      # captures). Shed preinstalled toolchains the gate never uses — the
      # Android SDK stays, android-host needs it. Preinstalled docker images
      # are pruned before any project container exists. A self-hosted runner
      # keeps its own toolchains and images, so the step is hosted-only.
      - name: Free hosted-runner disk for the full stack
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/share/swift /usr/local/share/powershell /usr/local/julia*
          sudo docker image prune --all --force >/dev/null
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          # A persistent self-hosted runner keeps the controller's untracked runtime
          # record beside its still-running test stack; wiping only the record makes
          # the next job re-provision onto foreign containers. Hosted runners are
          # fresh and clean fully.
          clean: ${{ runner.environment == 'github-hosted' }}

      - uses: ./.github/actions/setup-test
        with:
          android: "true"
          llm-tools: "true"
          provider-runtime: "true"

      - name: Run the candidate full gate
        run: ./scripts/test full

      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nexus-test-full-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
