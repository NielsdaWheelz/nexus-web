name: backend images

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: backend-images-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish immutable backend candidate
    if: github.run_attempt == 1
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      SOURCE_SHA: ${{ github.sha }}
      API_REPOSITORY: ghcr.io/nielsdawheelz/nexus-api
      WORKER_REPOSITORY: ghcr.io/nielsdawheelz/nexus-worker
      DOCKER_BUILD_RECORD_UPLOAD: "false"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: false

      - name: prove source identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: prepare bundle workspace
        id: release_workspace
        shell: bash
        run: deploy/hetzner/backend-publisher-workspace.sh prepare

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push api
        id: api
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.backend
          target: api
          push: true
          tags: ${{ env.API_REPOSITORY }}:${{ github.sha }}
          build-args: SOURCE_SHA=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: build and push worker
        id: worker
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.backend
          target: worker
          push: true
          tags: ${{ env.WORKER_REPOSITORY }}:${{ github.sha }}
          build-args: SOURCE_SHA=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: build immutable bundle
        shell: bash
        env:
          API_IMAGE: ${{ format('{0}@{1}', env.API_REPOSITORY, steps.api.outputs.digest) }}
          WORKER_IMAGE: ${{ format('{0}@{1}', env.WORKER_REPOSITORY, steps.worker.outputs.digest) }}
          RELEASE_WORKSPACE: ${{ steps.release_workspace.outputs.path }}
        run: |
          set -euo pipefail
          deploy/hetzner/backend-publisher-workspace.sh require "$RELEASE_WORKSPACE"
          bundle="$RELEASE_WORKSPACE/bundle"
          api_identity="$RELEASE_WORKSPACE/api-runtime-identity.json"
          worker_identity="$RELEASE_WORKSPACE/worker-runtime-identity.json"

          mkdir -m 700 -- "$bundle"
          docker pull "$API_IMAGE"
          docker pull "$WORKER_IMAGE"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$API_IMAGE")" = "$SOURCE_SHA"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$WORKER_IMAGE")" = "$SOURCE_SHA"
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --env PYTHONDONTWRITEBYTECODE=1 \
            --entrypoint python "$API_IMAGE" \
            -m nexus.release_artifact print-runtime-identity >"$api_identity"
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --env PYTHONDONTWRITEBYTECODE=1 \
            --entrypoint python "$WORKER_IMAGE" \
            -m nexus.release_artifact print-runtime-identity >"$worker_identity"
          cmp "$api_identity" "$worker_identity"

          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=python \
            python3 -B -m nexus.release_artifact write-candidate-manifest \
            --source-sha "$SOURCE_SHA" \
            --api-image "$API_IMAGE" \
            --worker-image "$WORKER_IMAGE" \
            --api-runtime-identity "$api_identity" \
            --worker-runtime-identity "$worker_identity" \
            --output "$bundle/candidate-manifest.json"
          install -Dm0555 deploy/hetzner/release.py "$bundle/release.py"
          install -Dm0444 python/nexus/__init__.py "$bundle/python/nexus/__init__.py"
          install -Dm0444 python/nexus/release_artifact.py \
            "$bundle/python/nexus/release_artifact.py"
          install -Dm0444 contracts/android-player-protocol.json \
            "$bundle/contracts/android-player-protocol.json"
          install -Dm0444 deploy/hetzner/docker-compose.yml "$bundle/docker-compose.yml"
          install -Dm0444 deploy/hetzner/Caddyfile "$bundle/Caddyfile"
          install -Dm0444 deploy/hetzner/nexus-codex-agent-host.apparmor \
            "$bundle/nexus-codex-agent-host.apparmor"

      - name: prove public digest access
        shell: bash
        env:
          API_IMAGE: ${{ format('{0}@{1}', env.API_REPOSITORY, steps.api.outputs.digest) }}
          WORKER_IMAGE: ${{ format('{0}@{1}', env.WORKER_REPOSITORY, steps.worker.outputs.digest) }}
          RELEASE_WORKSPACE: ${{ steps.release_workspace.outputs.path }}
        run: |
          set -euo pipefail
          deploy/hetzner/backend-publisher-workspace.sh require "$RELEASE_WORKSPACE"
          docker logout ghcr.io
          anonymous_config="$RELEASE_WORKSPACE/anonymous-docker-config"
          mkdir -m 700 -- "$anonymous_config"
          DOCKER_CONFIG="$anonymous_config" docker manifest inspect "$API_IMAGE" >/dev/null
          DOCKER_CONFIG="$anonymous_config" docker manifest inspect "$WORKER_IMAGE" >/dev/null

      - name: upload immutable bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nexus-backend-release-${{ github.sha }}
          path: ${{ steps.release_workspace.outputs.path }}/bundle/
          if-no-files-found: error
          retention-days: 90

      - name: remove pulled images
        if: ${{ always() && steps.api.outputs.digest != '' && steps.worker.outputs.digest != '' }}
        shell: bash
        env:
          API_IMAGE: ${{ format('{0}@{1}', env.API_REPOSITORY, steps.api.outputs.digest) }}
          WORKER_IMAGE: ${{ format('{0}@{1}', env.WORKER_REPOSITORY, steps.worker.outputs.digest) }}
        run: |
          set -euo pipefail
          docker image rm "$API_IMAGE" "$WORKER_IMAGE"

      - name: remove bundle workspace
        if: ${{ always() && steps.release_workspace.outputs.path != '' }}
        shell: bash
        env:
          RELEASE_WORKSPACE: ${{ steps.release_workspace.outputs.path }}
        run: deploy/hetzner/backend-publisher-workspace.sh cleanup "$RELEASE_WORKSPACE"
