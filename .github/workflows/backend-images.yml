name: backend images

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: backend-images-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish immutable backend candidate
    # First-attempt provenance: a rerun of this workflow publishes nothing, so
    # the only images a release can deploy are the ones attempt 1 built.
    if: github.run_attempt == 1
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      SOURCE_SHA: ${{ github.sha }}
      API_REPOSITORY: ghcr.io/nielsdawheelz/nexus-api
      WORKER_REPOSITORY: ghcr.io/nielsdawheelz/nexus-worker
      DOCKER_BUILD_RECORD_UPLOAD: "false"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: prove source identity
        shell: bash
        env:
          WORKSPACE: ${{ runner.temp }}/nexus-backend-release-${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          rm -rf -- "$WORKSPACE"
          mkdir -p -- "$WORKSPACE"
          chmod 700 -- "$WORKSPACE"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push api
        id: api
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.backend
          target: api
          push: true
          tags: ${{ env.API_REPOSITORY }}:${{ github.sha }}
          build-args: SOURCE_SHA=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: build and push worker
        id: worker
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.backend
          target: worker
          push: true
          tags: ${{ env.WORKER_REPOSITORY }}:${{ github.sha }}
          build-args: SOURCE_SHA=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: write the candidate manifest
        shell: bash
        env:
          WORKSPACE: ${{ runner.temp }}/nexus-backend-release-${{ github.sha }}
          API_IMAGE: ${{ format('{0}@{1}', env.API_REPOSITORY, steps.api.outputs.digest) }}
          WORKER_IMAGE: ${{ format('{0}@{1}', env.WORKER_REPOSITORY, steps.worker.outputs.digest) }}
        run: |
          set -euo pipefail
          api_identity="$WORKSPACE/api-runtime-identity.json"
          worker_identity="$WORKSPACE/worker-runtime-identity.json"
          docker pull "$API_IMAGE"
          docker pull "$WORKER_IMAGE"
          for image in "$API_IMAGE" "$WORKER_IMAGE"; do
            revision='{{ index .Config.Labels "org.opencontainers.image.revision" }}'
            test "$(docker image inspect --format "$revision" "$image")" = "$SOURCE_SHA"
          done
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --env PYTHONDONTWRITEBYTECODE=1 \
            --entrypoint python "$API_IMAGE" \
            -m nexus.release_artifact print-runtime-identity >"$api_identity"
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --env PYTHONDONTWRITEBYTECODE=1 \
            --entrypoint python "$WORKER_IMAGE" \
            -m nexus.release_artifact print-runtime-identity >"$worker_identity"
          cmp "$api_identity" "$worker_identity"

          mkdir -p -- "$WORKSPACE/bundle"
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=python \
            python3 -B -m nexus.release_artifact write-candidate-manifest \
            --source-sha "$SOURCE_SHA" \
            --api-image "$API_IMAGE" \
            --worker-image "$WORKER_IMAGE" \
            --api-runtime-identity "$api_identity" \
            --worker-runtime-identity "$worker_identity" \
            --output "$WORKSPACE/bundle/candidate-manifest.json"

      - name: prove public digest access
        shell: bash
        env:
          WORKSPACE: ${{ runner.temp }}/nexus-backend-release-${{ github.sha }}
          API_IMAGE: ${{ format('{0}@{1}', env.API_REPOSITORY, steps.api.outputs.digest) }}
          WORKER_IMAGE: ${{ format('{0}@{1}', env.WORKER_REPOSITORY, steps.worker.outputs.digest) }}
        run: |
          set -euo pipefail
          docker logout ghcr.io
          anonymous_config="$WORKSPACE/anonymous-docker-config"
          mkdir -p -- "$anonymous_config"
          chmod 700 -- "$anonymous_config"
          DOCKER_CONFIG="$anonymous_config" docker manifest inspect "$API_IMAGE" >/dev/null
          DOCKER_CONFIG="$anonymous_config" docker manifest inspect "$WORKER_IMAGE" >/dev/null

      - name: upload the candidate manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nexus-backend-release-${{ github.sha }}
          path: ${{ runner.temp }}/nexus-backend-release-${{ github.sha }}/bundle/
          if-no-files-found: error
          retention-days: 90

      - name: remove the pulled images and workspace
        if: ${{ always() }}
        shell: bash
        env:
          WORKSPACE: ${{ runner.temp }}/nexus-backend-release-${{ github.sha }}
          API_IMAGE: ${{ format('{0}@{1}', env.API_REPOSITORY, steps.api.outputs.digest) }}
          WORKER_IMAGE: ${{ format('{0}@{1}', env.WORKER_REPOSITORY, steps.worker.outputs.digest) }}
        run: |
          set -euo pipefail
          rm -rf -- "$WORKSPACE"
          if [ -n "${{ steps.api.outputs.digest }}" ]; then docker image rm "$API_IMAGE"; fi
          if [ -n "${{ steps.worker.outputs.digest }}" ]; then docker image rm "$WORKER_IMAGE"; fi
