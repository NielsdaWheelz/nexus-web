# Disposable project-owned disk data; auth remains owned by the Supabase CLI.
# Match the production database budget without charging all stored data to RAM.
services:
  postgres:
    mem_limit: 512m
    memswap_limit: 512m
    shm_size: 128m
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_search
      - -c
      - shared_buffers=64MB
      - -c
      - jit=off
      - -c
      - autovacuum_max_workers=1
      - -c
      - autovacuum_work_mem=16MB
