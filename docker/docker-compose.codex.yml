# optional native account host; add after the base and worker compose files.
# the account bind is explicit and writable; only this overlay shares its socket.

# Same two-name TLS passthrough policy as the production host. Keep this map
# and the host's extra_hosts together; the host has no general egress route.
x-codex-egress-conf: &codex-egress-conf |
  pid /tmp/nginx.pid;
  events {}
  stream {
      resolver 127.0.0.11 ipv6=off valid=30s;
      map $$ssl_preread_server_name $$upstream {
          chatgpt.com     chatgpt.com:443;
          auth.openai.com auth.openai.com:443;
          default         127.0.0.1:1;
      }
      server {
          listen 443;
          ssl_preread on;
          proxy_pass $$upstream;
          proxy_connect_timeout 10s;
          proxy_timeout 20m;
      }
  }

services:
  worker-interactive:
    environment:
      NEXUS_CODEX_NATIVE_SOCKET: /tmp/codex-daemon-10001/app-server.sock
    volumes:
      - nexus_codex_run:/tmp/codex-daemon-10001
  worker-background:
    environment:
      NEXUS_CODEX_NATIVE_SOCKET: /tmp/codex-daemon-10001/app-server.sock
    volumes:
      - nexus_codex_run:/tmp/codex-daemon-10001

  codex-egress-policy:
    image: nginx:1.30.5-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    restart: unless-stopped
    mem_reservation: 16m
    mem_limit: 64m
    memswap_limit: 64m
    pids_limit: 32
    user: "101:101"
    environment:
      NGINX_CONF: *codex-egress-conf
    entrypoint:
      - sh
      - -c
      - printf '%s' "$$NGINX_CONF" > /tmp/nginx.conf && exec nginx -e stderr -c /tmp/nginx.conf -g 'daemon off;'
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m
    networks:
      codex_private:
        ipv4_address: ${NEXUS_LOCAL_CODEX_SUBNET_PREFIX:-172.31.0}.2
      codex_proxy_egress: {}
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "443"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s

  nexus-codex-agent-host:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
      target: worker
      secrets:
        - universal_memory_deploy_key
      args:
        SOURCE_SHA: ${NEXUS_LOCAL_SOURCE_SHA:?set the exact local Git SHA}
    restart: on-failure:3
    mem_reservation: 256m
    mem_limit: 448m
    memswap_limit: 448m
    pids_limit: 64
    cpus: 1.0
    command: ["python", "-m", "apps.codex_agent.main"]
    user: "10001:10001"
    environment:
      NEXUS_CODEX_CREDENTIAL_FILE: /var/lib/nexus-codex/codex/codex-personal/auth.json
      NEXUS_CODEX_NATIVE_SOCKET: /tmp/codex-daemon-10001/app-server.sock
    depends_on:
      codex-egress-policy:
        condition: service_healthy
    working_dir: /tmp
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "chatgpt.com:${NEXUS_LOCAL_CODEX_SUBNET_PREFIX:-172.31.0}.2"
      - "auth.openai.com:${NEXUS_LOCAL_CODEX_SUBNET_PREFIX:-172.31.0}.2"
    networks:
      codex_private:
        ipv4_address: ${NEXUS_LOCAL_CODEX_SUBNET_PREFIX:-172.31.0}.3
    init: true
    stop_grace_period: 45s
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    ulimits:
      core: 0
      nofile: 1024
    volumes:
      - type: bind
        source: ${NEXUS_LOCAL_CODEX_ACCOUNT_DIR:-../.nexus-local/codex/codex-personal}
        target: /var/lib/nexus-codex/codex/codex-personal
        read_only: false
        bind:
          create_host_path: false
          propagation: rprivate
      - nexus_codex_run:/tmp/codex-daemon-10001
    healthcheck:
      test: ["CMD", "python", "-m", "apps.codex_agent.health"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  nexus_codex_run:

networks:
  codex_private:
    driver: bridge
    internal: true
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    ipam:
      config:
        - subnet: ${NEXUS_LOCAL_CODEX_SUBNET_PREFIX:-172.31.0}.0/24
  codex_proxy_egress:
    driver: bridge
