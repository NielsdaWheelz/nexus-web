# persistent local application stores; supabase owns its separate auth database.
# only the authenticated s3 endpoint is published. bucket/cors provisioning belongs
# to python/scripts/local_storage.py, shared by make dev and disposable runtimes.

name: nexus-local

services:
  postgres:
    image: localnexus-postgres:15-search-0.26.2
    build:
      context: ..
      dockerfile: docker/Dockerfile.postgres
    command: ["postgres", "-c", "shared_preload_libraries=pg_search"]
    # /dev/shm capacity; allocated pages still count toward container memory limits.
    shm_size: 128m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54320}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: ["mini", "-dir=/data", "-s3.allowedOrigins=", "-filer.allowedOrigins=", "-master.telemetry=false"]
    environment:
      AWS_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?set local storage credentials}
      AWS_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?set local storage credentials}
    ports:
      - "127.0.0.1:${LOCAL_S3_PORT:-8333}:8333"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8333"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  storage-data:

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: 127.0.0.1
