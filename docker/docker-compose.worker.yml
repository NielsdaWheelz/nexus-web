# linux queue lanes execute checkout source with image-installed dependencies.
# add docker-compose.codex.yml or docker-compose.memory.yml only when requested.

x-worker: &worker
  image: ${NEXUS_LOCAL_WORKER_IMAGE:?prepare the checkout worker image}
  environment: &worker-environment
    DATABASE_URL: ${WORKER_DATABASE_URL:-postgresql+psycopg://postgres:postgres@postgres:5432/postgres}
    R2_S3_API_ORIGIN: ${WORKER_R2_S3_API_ORIGIN:-http://storage:8333}
    R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?set local storage credentials}
    R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?set local storage credentials}
    R2_BUCKET: ${R2_BUCKET:-media}
    R2_REGION: ${R2_REGION:-us-east-1}
    NEXUS_ENV: local
    NEXUS_HANDLE_KEY:
    NEXUS_RUNTIME_IDENTITY_FILE: /app/local-runtime-identity.json
    APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://127.0.0.1:3000}
    DATABASE_STATEMENT_TIMEOUT_MS: 300000
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    PROVIDER_ENDPOINT_OVERRIDES: ${PROVIDER_ENDPOINT_OVERRIDES:-}
    PROVIDER_CA_PEM: ${PROVIDER_CA_PEM:-}
    GENERATION_API_PROVIDERS: ${GENERATION_API_PROVIDERS:-}
    OPENAI_GENERATION_API_KEY: ${OPENAI_GENERATION_API_KEY:-}
    ANTHROPIC_GENERATION_API_KEY: ${ANTHROPIC_GENERATION_API_KEY:-}
    GEMINI_GENERATION_API_KEY: ${GEMINI_GENERATION_API_KEY:-}
    DEEPSEEK_GENERATION_API_KEY: ${DEEPSEEK_GENERATION_API_KEY:-}
    XAI_GENERATION_API_KEY: ${XAI_GENERATION_API_KEY:-}
    BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
    YOUTUBE_DATA_API_KEY: ${YOUTUBE_DATA_API_KEY:-}
    X_API_BEARER_TOKEN: ${X_API_BEARER_TOKEN:-}
    DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
    PODCAST_INDEX_API_KEY: ${PODCAST_INDEX_API_KEY:-}
    PODCAST_INDEX_API_SECRET: ${PODCAST_INDEX_API_SECRET:-}
  depends_on:
    postgres:
      condition: service_healthy
    storage:
      condition: service_healthy
  volumes:
    - type: bind
      source: ${NEXUS_LOCAL_RUNTIME_IDENTITY_FILE:?generate a local runtime identity}
      target: /app/local-runtime-identity.json
      read_only: true
      bind:
        create_host_path: false
    - ../python/nexus:/app/nexus:ro
    - ../apps/worker:/app/apps/worker:ro
    - ../apps/codex_agent:/app/apps/codex_agent:ro
    - ../node/ingest/ingest.mjs:/app/node/ingest/ingest.mjs:ro
    - ../node/ingest/article_extraction.mjs:/app/node/ingest/article_extraction.mjs:ro
    - ../node/authored/helper.mjs:/app/node/authored/helper.mjs:ro
  init: true
  stop_grace_period: 30s

services:
  worker-interactive:
    <<: *worker
    environment:
      <<: *worker-environment
      WORKER_LANE: interactive
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "python", "-S", "-m", "apps.worker.health", "--lane", "interactive"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker-background:
    <<: *worker
    environment:
      <<: *worker-environment
      WORKER_LANE: background
    # the supervisor and its parser child share this production cgroup bound.
    mem_limit: 448m
    memswap_limit: 448m
    healthcheck:
      test: ["CMD", "python", "-S", "-m", "apps.worker.health", "--lane", "background"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
