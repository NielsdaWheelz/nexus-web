[project]
name = "nexus"
version = "0.1.0"
description = "Nexus backend API - a reading and notes platform"
readme = "README.md"
requires-python = ">=3.12.13,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "anyio>=4.12.1",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio,postgresql-psycopg]>=2.0.36",
    "alembic>=1.14.0",
    "pydantic-settings>=2.6.0",
    "PyJWT[crypto]>=2.15.1",
    "cryptography>=45.0.0",
    "httpcore>=1.0.9",
    "httpx>=0.28.0",
    "openai==2.53.0",
    "mcp==2.3.0",
    "universal-memory==0.1.0",
    "structlog>=24.1.0",
    "lxml>=5.0.0",
    "numpy>=2.5.3",
    "defusedxml>=0.7.1",
    "pillow>=10.0.0",
    "PyMuPDF>=1.24.0",
    "youtube-transcript-api>=1.2.4",
    "psycopg-binary>=3.1.0",
    "html5lib==1.1",
    "regex>=2024.11.6",
    "provider-runtime",
    "llm-agent-kernel==0.1.0",
    "llm-tools==0.1.0",
    "boto3>=1.43.7",
    "uuid6>=2025.0.1",
]

[project.optional-dependencies]
codex-agent = [
    "openai-codex-cli-bin==0.160.0",
]
dev = [
    "ruff>=0.8.0",
    "pyright>=1.1.390",
]

[project.scripts]
nexus = "nexus.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nexus"]

[tool.uv.sources]
universal-memory = { git = "https://github.com/NielsdaWheelz/universal-memory.git", rev = "c4bb0b3ce97424b7f2b6d8004e57f08009d64892" }
provider-runtime = { git = "https://github.com/NielsdaWheelz/llm-calling.git", rev = "2ab70c1ffbb26c60bd1a7d2af48582d59fb01759" }
llm-agent-kernel = { git = "https://github.com/NielsdaWheelz/llm-agent-kernel.git", rev = "adbb99547ff57a56b1df3b586119de870bbc23b3" }
llm-tools = { git = "https://github.com/NielsdaWheelz/llm-tools.git", rev = "c6a2b299f7a92c39d545960a6f2e5f30730e0fc3" }

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
extraPaths = [".."]
include = [
    "nexus",
    "scripts/disposable_runtime.py",
    "scripts/lab_codex.py",
    "scripts/lab_auth_cleanup.py",
    "scripts/lab_fake_codex.py",
    "scripts/lab_fake_providers.py",
    "scripts/local_storage.py",
    "../apps/api/main.py",
    "../apps/codex_agent",
    "../apps/worker/health.py",
    "../apps/worker/main.py",
    "../deploy/hetzner/release.py",
]
