[project]
name = "nexus"
version = "0.1.0"
description = "Nexus backend API - a reading and notes platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "anyio>=4.12.1",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio,postgresql-psycopg]>=2.0.36",
    "alembic>=1.14.0",
    "pydantic-settings>=2.6.0",
    "PyJWT[crypto]>=2.13.0",
    "httpx>=0.28.0",
    "structlog>=24.1.0",
    "lxml>=5.0.0",
    "defusedxml>=0.7.1",
    "pillow>=10.0.0",
    "PyMuPDF>=1.24.0",
    "python-multipart>=0.0.27",
    "youtube-transcript-api>=1.2.4",
    "psycopg-binary>=3.1.0",
    "html5lib==1.1",
    "regex>=2024.11.6",
    "stripe>=12.0.0",
    "provider-runtime",
    "llm-agent-kernel==0.1.0",
    "llm-tools==0.1.0",
    "boto3>=1.43.7",
    "uuid6>=2025.0.1",
    "mcp==2.1.0",
]

[project.optional-dependencies]
codex-agent = [
    "provider-runtime[codex-sdk]",
]
dev = [
    "cryptography>=45.0.0",
    "ruff>=0.8.0",
    "pyright>=1.1.390",
]

[project.scripts]
nexus = "nexus.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nexus"]

[tool.uv.sources]
provider-runtime = { git = "https://github.com/NielsdaWheelz/llm-calling.git", rev = "97fbac7fece4f1ea54651b7d6344df9fac3b2791" }
llm-agent-kernel = { git = "https://github.com/NielsdaWheelz/llm-agent-kernel.git", rev = "0c400beeae075ee47e7a8563d00f9117e920380e" }
llm-tools = { git = "https://github.com/NielsdaWheelz/llm-tools.git", rev = "9e6d155f3b64f03495911435b7cae8b8d131f9a2" }

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
extraPaths = [".."]
include = [
    "nexus",
    "../apps/api/main.py",
    "../apps/codex_agent",
    "../apps/worker/health.py",
    "../apps/worker/main.py",
    "../deploy/hetzner/release.py",
]
